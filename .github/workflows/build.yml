name: build

# Build the daemon + UI and produce every distributable: .deb and .rpm, the
# portable tarball, and the Windows installer. Runs on tags and manual
# dispatch; on a tag all four are attached to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          # Flutter Linux desktop toolchain + GTK, plus the tray backend lib.
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update && sudo apt-get install -y nfpm

      # On a tag the tag *is* the version, so stamp from it and let
      # set-version.sh reject anything that is not X.Y.Z. Off a tag the
      # VERSION file stands on its own.
      - name: Stamp version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            packaging/set-version.sh "${tag#v}"
          else
            packaging/set-version.sh
          fi

      - name: Build .deb and .rpm
        run: make linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

  # The portable tarball is the install path for distros the packages do not
  # cover, so it is built in the debian:bookworm images from packaging/docker
  # rather than on the runner: binaries linked against the runner's much newer
  # glibc would only run on equally new systems.
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the toolchain images
        run: |
          docker build -t quartz-daemon-build \
            -f packaging/docker/Dockerfile.daemon packaging/docker
          # build.sh runs the UI image as the invoking user; bake that user in
          # so flutter has a writable HOME (the runner is not uid 1000).
          docker build -t quartz-ui-build \
            --build-arg "BUILDER_UID=$(id -u)" \
            --build-arg "BUILDER_GID=$(id -g)" \
            -f packaging/docker/Dockerfile.ui packaging/docker

      - name: Stamp version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            packaging/set-version.sh "${tag#v}"
          else
            packaging/set-version.sh
          fi

      - name: Build tarball
        run: packaging/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/quartz-*-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Stamp version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            packaging/set-version.sh "${tag#v}"
          else
            packaging/set-version.sh
          fi

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Unsigned installer: no code-signing cert, so users get a SmartScreen
      # "unknown publisher" prompt. The MSIX path needs a trusted cert to be
      # installable by anyone but the build machine, so it is not built here.
      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/quartz-setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, tarball, windows]
    runs-on: ubuntu-latest
    # Creating the release is a write to the repo; the default token is
    # read-only unless the job asks for more.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          # A silently empty release is worse than a failed job.
          fail_on_unmatched_files: true
